<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle Background (Soft Emerald) -->
  <rect width="512" height="512" rx="128" fill="#f0fdf4" />
  
  <!-- Stylized Geometric Leaf & Mobius M Loop -->
  <g filter="url(#glow)">
    <!-- Main Left Stem/Loop -->
    <path d="M156 368 C120 368, 96 340, 96 300 C96 230, 160 180, 256 120 C352 180, 416 230, 416 300 C416 340, 392 368, 356 368 C310 368, 280 320, 256 280 C232 320, 202 368, 156 368 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Dynamic Upcycling Leaf Arc -->
    <path d="M256 120 C256 120, 290 190, 290 240 C290 265, 275 285, 256 285 C237 285, 222 265, 222 240 C222 190, 256 120, 256 120 Z" 
          fill="url(#accentGrad)" />

    <!-- AI Tech Node / Spark Accent -->
    <circle cx="256" cy="205" r="14" fill="#ffffff" />
    <circle cx="256" cy="205" r="7" fill="#047857" />

    <!-- Circular Motion Arrows / Nodes -->
    <circle cx="160" cy="330" r="10" fill="#10b981" />
    <circle cx="352" cy="330" r="10" fill="#06b6d4" />
  </g>
  
  <!-- Letter M Modern Baseline Subtle Mark -->
  <path d="M190 410 L256 370 L322 410" 
        fill="none" 
        stroke="#059669" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8" />
</svg>